name: Выкладка на хостинг (FTP)

# Запускается вручную: Actions → «Выкладка на хостинг (FTP)» → Run workflow.
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD — доступ к хостингу; SITE_URL — адрес сайта, например https://klyuch.ru
# api/config.php (токен бота) и api/leads/ (заявки) на сервере не трогаются: их нет в сборке и они исключены ниже.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./public_html/
          exclude: |
            **/api/config.php
            **/api/leads/**
