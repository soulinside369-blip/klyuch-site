name: Выкладка в Yandex Cloud (Object Storage)

# Сайт айтиключ.рф лежит в бакете Object Storage с тем же именем, HTTPS — бесплатный Let's Encrypt из Certificate Manager.
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   YC_KEY_ID, YC_SECRET — статический ключ доступа сервисного аккаунта с ролью storage.editor на бакет.
# Пока секретов нет, выкладка пропускается (сборка на GitHub Pages продолжает работать).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: yandex
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BUCKET: xn--80aqcff3bzb5c.xn--p1ai
      HAS_KEYS: ${{ secrets.YC_KEY_ID != '' }}
    steps:
      - name: Нет ключей — пропускаем
        if: env.HAS_KEYS != 'true'
        run: echo "Секреты YC_KEY_ID/YC_SECRET не заданы — выкладка в Yandex Cloud пропущена."
      - uses: actions/checkout@v4
        if: env.HAS_KEYS == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_KEYS == 'true'
        with:
          node-version: 20
          cache: npm
      - if: env.HAS_KEYS == 'true'
        run: npm ci && npm run build
        env:
          SITE_URL: https://xn--80aqcff3bzb5c.xn--p1ai
      - name: Загрузка в бакет
        if: env.HAS_KEYS == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          S3="aws --endpoint-url=https://storage.yandexcloud.net s3"
          # Файлы с хешем в имени — кэш на год; страницы — без кэша, чтобы обновления видели сразу. PHP здесь не работает — api/ не грузим.
          $S3 sync dist/_astro "s3://$BUCKET/_astro" --delete --cache-control "public,max-age=31536000,immutable"
          $S3 sync dist "s3://$BUCKET" --delete --exclude "_astro/*" --exclude "api/*" --cache-control "no-cache"
